name: Release

# Push a tag like v0.3.0 (matching "version" in src/manifest.json) to publish a release:
# the zip and SHA256SUMS are built here, from that exact commit, with a signed provenance attestation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag must match the manifest version
        run: |
          v=$(node -p "require('./src/manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - run: node scripts/audit.mjs
      - run: node scripts/audit-selftest.mjs
      - run: node scripts/build.mjs
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "RigForge Helper $GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Verify: rebuild with \`node scripts/build.mjs\` and compare SHA256SUMS, or \`gh attestation verify\` (see README)."
